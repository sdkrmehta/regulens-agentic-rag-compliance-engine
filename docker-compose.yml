services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: regulens-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  fastapi-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: regulens-backend
    restart: unless-stopped
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - qdrant

  streamlit-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: regulens-frontend
    restart: unless-stopped
    command: ["streamlit", "run", "frontend/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - FASTAPI_URL=http://fastapi-backend:8000
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - fastapi-backend

volumes:
  qdrant_data:
